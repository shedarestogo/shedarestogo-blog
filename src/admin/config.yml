backend:
  name: git-gateway
  branch: main

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Posts"
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text", hint: "Shows on Google and the blog list. Keep it under 160 characters." }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "gear"
    label: "Gear"
    folder: "src/gear"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Link", name: "link", widget: "string", hint: "Full URL to the product or Amazon listing." }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Blurb", name: "blurb", widget: "text", hint: "One or two sentences on why you love it." }

  - name: "homepage"
    label: "Homepage"
    files:
      - name: "homepage"
        label: "Homepage settings"
        file: "src/index.njk"
        fields:
          - { label: "Headline", name: "hero_headline", widget: "string", hint: "The big headline on the front page." }
          - { label: "Subheadline", name: "hero_subline", widget: "text", hint: "The smaller line under the headline." }
          - { label: "Hero Photo", name: "hero_image", widget: "image", required: false, hint: "The big photo across the front page." }
